server:
  port: 8082


management:
  endpoints:
    web:
      exposure:
        include: "*"


spring:
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

logging:
  level:
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.hibernate.SQL: DEBUG
